<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <style>
        :root {
            --primary: #10b981;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }
        .card { 
            background: var(--card-bg); 
            padding: 2.5rem; 
            border-radius: 16px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin-top: 0; font-weight: 700; color: #fff; text-align: center; }
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: #94a3b8; }
        input { 
            display: block; 
            width: 100%; 
            padding: 0.75rem; 
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); }
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            cursor: pointer; 
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background: #059669; }
        button:active { transform: scale(0.98); }
        .result-box { 
            margin-top: 1.5rem; 
            padding: 1rem; 
            background: #0f172a; 
            border-radius: 8px; 
            border-left: 4px solid var(--primary);
            display: none; 
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-label { font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem; }
        .result-value { font-size: 1.25rem; font-weight: 700; color: #fff; }
        .note { margin-top: 1.5rem; font-size: 0.75rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Simple Interest</h2>
        <form id="interestForm">
            <div class="input-group">
                <label>Principal Amount</label>
                <input type="number" id="principal" name="principal" placeholder="1000" required>
            </div>
            
            <div class="input-group">
                <label>Rate of Interest (%)</label>
                <input type="number" id="rate" name="rate" placeholder="5" step="0.01" required>
            </div>
            
            <div class="input-group">
                <label>Time (Years)</label>
                <input type="number" id="time" name="time" placeholder="2" required>
            </div>
            
            <button type="submit" id="submitBtn">Calculate Interest</button>

            <div id="resultBox" class="result-box">
                <div class="result-label">Calculated Simple Interest</div>
                <div id="resultValue" class="result-value">---</div>
            </div>

            <div class="note">Talking to http://localhost:7002/interest</div>
        </form>
    </div>

    <script>
        document.getElementById('interestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const principal = document.getElementById('principal').value;
            const rate = document.getElementById('rate').value;
            const time = document.getElementById('time').value;
            const resultBox = document.getElementById('resultBox');
            const resultValue = document.getElementById('resultValue');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.textContent = 'Calculating...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`http://localhost:7002/interest?principal=${principal}&rate=${rate}&time=${time}`);
                const data = await response.text();
                
                resultValue.textContent = data.replace('Simple interest: ', '');
                resultBox.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('Server is not responding. Make sure SimpleInterestServer is running.');
            } finally {
                submitBtn.textContent = 'Calculate Interest';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
